<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Gorilla Tag Merch Store!</title>
    <style>
        /* Plain, low-effort aesthetics matching the target image */
        body {
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            font-family: "Times New Roman", Times, serif;
            color: #000000;
        }

        #page-wrapper {
            width: 100%;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 0;
        }

        #inner-frame {
            background-color: #ffffff;
            padding: 0;
            text-align: center;
        }

        /* Loading Screen adjusted to match plain look */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .loading-box {
            background: #ffffff;
            padding: 20px;
            text-align: center;
            width: 320px;
        }

        .loading-box h1 {
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: normal;
            color: #000000;
        }

        .progress-container {
            width: 100%;
            height: 16px;
            background: #ffffff;
            border: 1px solid #000000;
            margin-top: 15px;
            position: relative;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #4caf50;
        }

        /* Main Content reveal layout */
        #main-content {
            display: none; 
            position: relative;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* Snap-reveal overlay tiles */
        .snap-tile {
            position: absolute;
            background-color: #ffffff;
            z-index: 1000;
            pointer-events: none;
        }

        #tile-half {
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
        }

        #tile-quarter {
            top: 0;
            right: 0;
            width: 25%;
            height: 100%;
        }

        #tile-eighth-1 {
            top: 0;
            left: 50%;
            width: 12.5%;
            height: 100%;
        }

        #tile-eighth-2 {
            top: 0;
            left: 62.5%;
            width: 12.5%;
            height: 100%;
        }

        /* Simple Hero Header Image/Banner */
        .banner-container {
            width: 100%;
            position: relative;
            border-bottom: 1px solid #000000;
            margin-bottom: 20px;
        }

        .banner-img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            display: block;
        }

        .banner-text {
            position: absolute;
            bottom: 10px;
            right: 20px;
            color: #ffffff;
            font-size: 32px;
            text-shadow: 2px 2px 4px #000000;
        }

        .secret-free-link {
            color: inherit;
            text-decoration: none;
            cursor: pointer;
        }

        .secret-free-link:hover {
            text-decoration: underline;
        }

        /* Plain section headers */
        .page-title {
            font-size: 28px;
            margin: 15px 0;
            font-weight: normal;
        }

        #floating-text {
            color: #000000; 
            font-size: 20px;
            margin-bottom: 25px;
            direction: rtl;
        }

        /* Barebones Content Layout */
        .content-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            width: 100%;
        }

        .product-thumbnail {
            width: 150px;
            height: auto;
        }

        /* Glossy Pill Download Button Styling from image */
        #order-btn {
            background: linear-gradient(to bottom, #52d053 0%, #2bb62d 50%, #1f8a20 100%);
            border: 2px solid #ffffff;
            outline: 1px solid #1f8a20;
            border-radius: 25px;
            padding: 10px 35px;
            cursor: pointer;
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
            box-shadow: 0px 3px 6px rgba(0,0,0,0.3);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        #order-btn:hover {
            background: linear-gradient(to bottom, #62e063 0%, #3bc63d 50%, #2fa530 100%);
        }

        #order-btn::before {
            content: '⤓';
            font-size: 24px;
        }

        .site-footer {
            margin-top: 50px;
            padding-bottom: 20px;
            font-size: 14px;
            color: #000000;
        }

        /* Transaction Overlay */
        #purchase-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .overlay-box {
            background: #ffffff;
            padding: 30px;
        }

        #purchase-overlay h1 {
            font-size: 22px;
            color: #000000;
            font-weight: normal;
            margin-bottom: 15px;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2bb62d;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
            margin: 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loading-box">
            <h1>LOADING...</h1>
            <p id="loading-status">connecting...</p>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>
    </div>

    <audio id="ambient-noise" loop>
        <source src="ambient.mp3" type="audio/mp3">
    </audio>

    <div id="page-wrapper">
        <div id="inner-frame" style="position: relative;">
            
            <!-- Snap-reveal overlays -->
            <div class="snap-tile" id="tile-half"></div>
            <div class="snap-tile" id="tile-quarter"></div>
            <div class="snap-tile" id="tile-eighth-1"></div>
            <div class="snap-tile" id="tile-eighth-2"></div>

            <div id="main-content">
                
                <div class="banner-container">
                    <img src="banner.png" alt="Monkey Chase" class="banner-img" onerror="this.style.display='none'">
                    <div class="banner-text">
                        Monkey <a href="https://deceased.freegorillatagdownload.com" class="secret-free-link">FREE</a> Chase
                    </div>
                </div>

                <div class="page-title">downlod</div>

                <div id="floating-text">احصل على الخاص بك الآن</div>

                <div class="content-body">
                    <img src="thumb.png" alt="Early Access Gorilla" class="product-thumbnail" onerror="this.src='button.png'">
                    
                    <button id="order-btn">
                        DOWNLOAD
                    </button>
                </div>

                <div class="site-footer">
                    <p>gorilla tag free merch claimer</p>
                </div>

            </div>
        </div>
    </div>

    <div id="purchase-overlay">
        <div class="overlay-box">
            <h1>verifying downlod...</h1>
            <div class="loader"></div>
            <p>Please wait...</p>
        </div>
    </div>

    <script>
        const loadingScreen = document.getElementById('loading-screen');
        const progressBar = document.getElementById('progress-bar');
        const loadingStatus = document.getElementById('loading-status');
        const mainContent = document.getElementById('main-content');
        const orderBtn = document.getElementById('order-btn');
        const overlay = document.getElementById('purchase-overlay');
        const audio = document.getElementById('ambient-noise');

        // Tiles
        const tileHalf = document.getElementById('tile-half');
        const tileQuarter = document.getElementById('tile-quarter');
        const tileEighth1 = document.getElementById('tile-eighth-1');
        const tileEighth2 = document.getElementById('tile-eighth-2');

        function fadeInAudio(audioElement, duration) {
            audioElement.volume = 0;
            audioElement.play().catch(() => {});
            let volume = 0;
            const interval = 50; 
            const step = interval / duration;
            const fadeIn = setInterval(() => {
                volume += step;
                if (volume >= 1) {
                    audioElement.volume = 1;
                    clearInterval(fadeIn);
                } else {
                    audioElement.volume = volume;
                }
            }, interval);
        }

        // Loading Progress Logic
        let progress = 0;
        const loadInterval = setInterval(() => {
            progress += 1;
            progressBar.style.width = progress + '%';

            if (progress === 30) {
                loadingStatus.textContent = 'fetching files...';
            } else if (progress === 70) {
                loadingStatus.textContent = 'almost ready...';
            } else if (progress >= 100) {
                clearInterval(loadInterval);
                startSnapReveal();
            }
        }, 100);

        function startSnapReveal() {
            loadingScreen.style.display = 'none';
            mainContent.style.display = 'flex';
            fadeInAudio(audio, 3000);

            // Reveal sequence
            setTimeout(() => {
                tileHalf.style.display = 'none';
            }, 100);

            setTimeout(() => {
                tileQuarter.style.display = 'none';
            }, 400);

            setTimeout(() => {
                tileEighth1.style.display = 'none';
            }, 700);

            setTimeout(() => {
                tileEighth2.style.display = 'none';
            }, 950);
        }

        orderBtn.addEventListener('click', () => {
            overlay.style.display = 'flex';
            setTimeout(() => {
                window.location.href = "https://devoure.freegorillatagdownload.com";
            }, 3000);
        });
    </script>
</body>
</html>
